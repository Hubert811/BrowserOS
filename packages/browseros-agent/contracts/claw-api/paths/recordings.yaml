streamList:
  get:
    operationId: listRecordingStreams
    summary: Newest-first index of recorded streams for out-of-process discovery.
    parameters:
      - name: fromMs
        in: query
        schema:
          type: integer
          format: int64
      - name: toMs
        in: query
        schema:
          type: integer
          format: int64
      - name: tabId
        in: query
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        schema:
          type: integer
          format: int64
          default: 200
          maximum: 1000
    responses:
      '200':
        description: Recorded stream index.
        content:
          application/json:
            schema:
              $ref: ../schemas/recordings.yaml#/RecordingStreamList
      '500':
        $ref: ../responses.yaml#/InternalError

streamEvents:
  get:
    operationId: readRecordingStreamEvents
    summary: Read one document's rrweb events as NDJSON, bypassing session attribution.
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      - name: fromMs
        in: query
        schema:
          type: integer
          format: int64
      - name: toMs
        in: query
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Newline-delimited rrweb events.
        content:
          application/x-ndjson:
            schema:
              type: string
      '400':
        $ref: ../responses.yaml#/BadRequest
      '500':
        $ref: ../responses.yaml#/InternalError

ingest:
  post:
    operationId: appendRecordingEvents
    parameters:
      - $ref: ../parameters.yaml#/RecordingTabId
      - $ref: ../parameters.yaml#/RecordingDocumentId
      - $ref: ../parameters.yaml#/RecordingBatchId
      - $ref: ../parameters.yaml#/RecordingGap
    requestBody:
      required: true
      description: Atomic newline-delimited rrweb events for one Chrome document. The UTF-8 encoded request body must not exceed the server's advertised recordingIngestMaxBytes capability.
      content:
        application/x-ndjson:
          schema:
            type: string
    responses:
      '200':
        description: Number of newly accepted event lines. A durable duplicate returns zero.
        content:
          application/json:
            schema:
              $ref: ../schemas/recordings.yaml#/AppendRecordingEventsResponse
      '400':
        $ref: ../responses.yaml#/BadRequest
      '403':
        $ref: ../responses.yaml#/Forbidden
      '413':
        $ref: ../responses.yaml#/PayloadTooLarge
      '500':
        $ref: ../responses.yaml#/InternalError
metadata:
  get:
    operationId: getRecording
    parameters:
      - $ref: ../parameters.yaml#/SessionId
    responses:
      '200':
        description: Recording metadata, including an empty known recording.
        content:
          application/json:
            schema:
              $ref: ../schemas/recordings.yaml#/RecordingMetadata
      '404':
        $ref: ../responses.yaml#/NotFound
      '500':
        $ref: ../responses.yaml#/InternalError
events:
  get:
    operationId: downloadRecordingEvents
    parameters:
      - $ref: ../parameters.yaml#/SessionId
    responses:
      '200':
        description: Opaque newline-delimited rrweb events.
        content:
          application/x-ndjson:
            schema:
              type: string
      '404':
        $ref: ../responses.yaml#/NotFound
      '500':
        $ref: ../responses.yaml#/InternalError
